<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LS Tool</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Segoe UI",system-ui,Arial,sans-serif;
    background:#0f172a;color:#e2e8f0;
    -webkit-user-select:none;user-select:none;
  }
  .box{text-align:center;transform:translateY(-6%)}
  .ring{
    width:56px;height:56px;margin:0 auto 22px;
    border:5px solid rgba(148,163,184,.25);
    border-top-color:#38bdf8;border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .name{font-size:22px;font-weight:600;letter-spacing:.3px}
  .msg{margin-top:8px;font-size:13px;color:#94a3b8}
  @media (prefers-color-scheme: light){
    body{background:#f8fafc;color:#0f172a}
    .msg{color:#64748b}
    .ring{border-color:rgba(100,116,139,.25);border-top-color:#0284c7}
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <div class="name">LS Tool</div>
    <div class="msg">Starting up…</div>
  </div>
<script>
  // The target app URL is passed in the hash, e.g. #http%3A%2F%2F127.0.0.1%3A55497
  var target = decodeURIComponent(location.hash.slice(1));
  var tries = 0;
  function go(){ location.replace(target); }
  function check(){
    if (!target){ return; }
    tries++;
    // no-cors: resolves the moment the server answers at all (opaque response),
    // rejects while it's still refusing connections — so we advance exactly when ready.
    fetch(target + "/_stcore/health", { mode: "no-cors", cache: "no-store" })
      .then(go)
      .catch(function(){ tries > 30 ? go() : setTimeout(check, 400); });
  }
  setTimeout(check, 300);
</script>
</body>
</html>
